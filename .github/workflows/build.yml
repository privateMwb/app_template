# ============================================================
# .github/workflows/build.yml
# Configures and builds the backend across compilers and build
# types.
#
# Linux-only for now: add macOS/MSVC to the matrix only once
# actually built and verified there, rather than claim support
# that hasn't been checked.
#
# No test step: backend/ has no tests/ directory yet in this
# template. Add one (and a corresponding step here, e.g. `ctest`)
# once real tests exist.
# ============================================================

name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: "${{ matrix.compiler }} | ${{ matrix.build_type }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - compiler: GCC
            cxx: g++
            build_type: Debug

          - compiler: GCC
            cxx: g++
            build_type: Release

          - compiler: Clang
            cxx: clang++
            build_type: Debug

          - compiler: Clang
            cxx: clang++
            build_type: Release

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure
        working-directory: backend
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build-${{ matrix.compiler }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: backend
        run: cmake --build build-${{ matrix.compiler }}-${{ matrix.build_type }} --config ${{ matrix.build_type }}
